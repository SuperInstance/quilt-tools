name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: run all ten tools (each ends with its own verdict)
        run: for f in tools/*.mjs; do echo "── $f"; node "$f" || exit 1; done
      - name: GAN-hardened elites in-place verification
        run: |
          for v in gan-elites/*/verify.mjs; do echo "── $v"; node "$v" || exit 1; done
